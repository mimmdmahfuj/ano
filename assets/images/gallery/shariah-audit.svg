<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shariahGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052622"/>
      <stop offset="50%" stop-color="#08423d"/>
      <stop offset="100%" stop-color="#0c5a52"/>
    </linearGradient>
    <linearGradient id="goldGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8bf72"/>
      <stop offset="100%" stop-color="#c69234"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#shariahGrad)"/>
  
  <!-- Scale / Justice / Quranic ethics vector -->
  <g transform="translate(400, 200) scale(1.1)">
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#d4a34b" stroke-width="6"/>
    <line x1="-80" y1="-50" x2="80" y2="-50" stroke="#d4a34b" stroke-width="5"/>
    <!-- Left pan -->
    <path d="M -80 -50 L -110 0 L -50 0 Z" fill="none" stroke="#9ce3d7" stroke-width="2"/>
    <path d="M -120 0 C -120 25, -40 25, -40 0 Z" fill="#2ba89b"/>
    <!-- Right pan -->
    <path d="M 80 -50 L 50 0 L 110 0 Z" fill="none" stroke="#9ce3d7" stroke-width="2"/>
    <path d="M 40 0 C 40 25, 120 25, 120 0 Z" fill="#2ba89b"/>
    <!-- Base -->
    <path d="M -40 70 L 40 70 L 25 80 L -25 80 Z" fill="#d4a34b"/>
  </g>
  
  <rect x="50" y="380" width="700" height="85" rx="14" fill="rgba(3, 31, 29, 0.88)" stroke="rgba(43, 168, 155, 0.3)"/>
  <text x="80" y="420" font-family="'Noto Sans Bengali', sans-serif" font-size="20" font-weight="bold" fill="#ffffff">শরী'আহ নিরীক্ষা ও হিসাব পর্যালোচনা বৈঠক</text>
  <text x="80" y="445" font-family="'Noto Sans Bengali', sans-serif" font-size="14" fill="#9ce3d7">যাবতীয় লেনদেন ইসলামি আইন ও মুদারাবা মূলনীতি অনুযায়ী যাচাইকরণ</text>
  <rect x="620" y="405" width="100" height="32" rx="16" fill="url(#goldGrad5)"/>
  <text x="670" y="426" font-family="'Noto Sans Bengali', sans-serif" font-size="12" font-weight="bold" fill="#042320" text-anchor="middle">মিটিং</text>
</svg>
