<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="agroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052c21"/>
      <stop offset="50%" stop-color="#0b4737"/>
      <stop offset="100%" stop-color="#14604b"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8bf72"/>
      <stop offset="100%" stop-color="#c69234"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#agroGrad)"/>
  
  <!-- Plant & Greenery Vector -->
  <g transform="translate(400, 240) scale(1.3)">
    <circle cx="0" cy="-20" r="100" fill="rgba(43, 168, 155, 0.15)"/>
    <!-- Leaves -->
    <path d="M 0 40 C -60 10, -80 -60, 0 -90 C 80 -60, 60 10, 0 40 Z" fill="#2ba89b" opacity="0.9"/>
    <path d="M 0 40 C -30 20, -50 -30, 0 -60 C 50 -30, 30 20, 0 40 Z" fill="#9ce3d7"/>
    <path d="M 0 40 L 0 -85" stroke="#042421" stroke-width="3"/>
    <!-- Sprout small -->
    <path d="M -20 10 C -50 -5, -60 -40, -10 -30 Z" fill="#d4a34b"/>
    <path d="M 20 10 C 50 -5, 60 -40, 10 -30 Z" fill="#d4a34b"/>
  </g>
  
  <!-- Overlay Card Info -->
  <rect x="50" y="380" width="700" height="85" rx="14" fill="rgba(3, 31, 29, 0.88)" stroke="rgba(43, 168, 155, 0.3)"/>
  <text x="80" y="420" font-family="'Noto Sans Bengali', sans-serif" font-size="20" font-weight="bold" fill="#ffffff">হালাল এগ্রো ও খামার প্রকল্প পরিদর্শন</text>
  <text x="80" y="445" font-family="'Noto Sans Bengali', sans-serif" font-size="14" fill="#9ce3d7">সদস্যদের যৌথ অর্থায়নে পরিচালিত কৃষি ও প্রাণিসম্পদ উদ্যোগ</text>
  <rect x="620" y="405" width="100" height="32" rx="16" fill="url(#goldGrad2)"/>
  <text x="670" y="426" font-family="'Noto Sans Bengali', sans-serif" font-size="12" font-weight="bold" fill="#042320" text-anchor="middle">প্রকল্প</text>
</svg>
